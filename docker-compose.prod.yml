# Production on the VPS. Use ./deploy.sh rather than running this directly.
# Caddy on the host proxies apps.zeneke.com to 127.0.0.1:${ZENEKE_PORT}.
name: zeneke-prod

services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DATA_DIR: /data
    ports:
      # Loopback only: reachable from Caddy on the host, not from the internet.
      - "127.0.0.1:${ZENEKE_PORT:-8010}:8000"
    volumes:
      - zeneke-data:/data

volumes:
  zeneke-data:
