{{ attrs.form.non_field_errors }}
{% for field in attrs.form %}
    {% if field.is_hidden %}
        {{ field }}
    {% else %}
        <div class="mb-3">
            <label for="{{ field.id_for_label }}" class="form-label small">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors }}</div>{% endif %}
            {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
        </div>
    {% endif %}
{% endfor %}
