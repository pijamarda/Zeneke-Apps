{% load allauth %}
<section class="card border-secondary-subtle mb-3">
    <div class="card-body">
        <h2 class="h5 fw-bold mb-2">
            {% slot title %}
            {% endslot %}
        </h2>
        {% slot body %}
        {% endslot %}
        {% if slots.actions %}
            <div class="d-flex flex-wrap gap-2 mt-3">
                {% for action in slots.actions %}{{ action }}{% endfor %}
            </div>
        {% endif %}
    </div>
</section>
