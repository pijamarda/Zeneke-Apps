{% load static %}<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}Bingo{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'bingo/bingo.css' %}">
</head>
<body class="bingo {% block body_class %}{% endblock %}">
<header class="bingo-header">
    <a href="{% url 'bingo:start' %}" class="bingo-brand">🎱 Bingo</a>
    {% block header_extra %}{% endblock %}
</header>
<main class="bingo-main">
    {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
