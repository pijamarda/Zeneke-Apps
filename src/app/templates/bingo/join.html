{% extends "bingo/base.html" %}

{% block title %}Unirse a {{ room.code }} — Bingo{% endblock %}

{% block content %}
<div class="bingo-narrow">
    <p class="text-secondary mb-1">Sala</p>
    <h1 class="display-5 fw-bold room-code mb-4">{{ room.code }}</h1>

    {% if message %}
        <div class="alert alert-warning" role="alert">{{ message }}</div>
    {% endif %}

    <form method="post" action="{% url 'bingo:join' room.code %}">
        {% csrf_token %}
        <label for="nickname" class="form-label">¿Cómo te llamas?</label>
        <input type="text" id="nickname" name="nickname" value="{{ nickname }}" class="form-control form-control-lg mb-3"
               maxlength="{{ max_length }}" autocomplete="nickname" required autofocus>
        <button type="submit" class="btn btn-primary btn-lg w-100">Jugar</button>
    </form>
</div>
{% endblock %}
