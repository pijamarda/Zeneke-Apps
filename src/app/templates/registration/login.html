{% extends "base.html" %}
{% load socialaccount %}

{% block title %}Login — Zeneke{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-5 col-lg-4">
        <div class="card border-secondary-subtle mt-4">
            <div class="card-body p-4">
                <h4 class="card-title fw-bold mb-1">Sign in</h4>
                <p class="text-white-50 small mb-4">Choose a provider to continue.</p>

                <div class="d-grid gap-2">
                    <a href="{% provider_login_url 'google' %}" class="btn btn-outline-light btn-social">
                        <svg class="me-2" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
                            <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.5 6.9 29.5 5 24 5 12.9 5 4 13.9 4 25s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/>
                            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19.1 13 24 13c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.5 7.4 29.5 5 24 5c-7.7 0-14.4 4.1-18.1 10.3-.1.1-.5.9-.6 1.4z"/>
                            <path fill="#4CAF50" d="M24 44c5.2 0 10-1.9 13.6-5l-6.3-5.3C29.5 35.5 26.9 36 24 36c-5.1 0-9.6-3.3-11.3-7.9l-6.5 5C9.7 40 16.4 44 24 44z"/>
                            <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.3 5.3C41.3 36.2 44 31 44 25c0-1.3-.1-2.6-.4-3.9z"/>
                        </svg>
                        Continue with Google
                    </a>

                    <a href="{% provider_login_url 'github' %}" class="btn btn-outline-light btn-social">
                        <i class="bi bi-github me-2 fs-6"></i>
                        Continue with GitHub
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
